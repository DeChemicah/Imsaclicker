<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="An idle endurance-racing clicker. Build your sports car team from GTD to GTP.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IMSA Clicker">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>IMSA Clicker</title>
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="bank">
        <div id="money" class="money">$0</div>
        <div class="rate"><span id="ips">$0</span> / sec</div>
      </div>
      <div class="badges">
        <div id="classBadge" class="class-badge">GTD</div>
        <div class="lp" title="Legacy Points">⭐ <span id="lpCount">0</span></div>
      </div>
    </header>

    <section id="stage" class="stage" aria-label="Tap the car to earn prize money">
      <div class="sky"><div class="sun"></div></div>
      <div class="stands"></div>
      <div class="fence"></div>
      <div class="road">
        <div id="curb" class="curb"></div>
        <div id="lane" class="lane"></div>
      </div>
      <div id="stagePhoto" class="stage-photo"></div>
      <div id="car" class="car"></div>
      <div id="carName" class="car-name"></div>
      <div class="hud">
        <div class="hud-stats">
          <div class="hud-tap">Per tap<b id="tapVal">$1</b></div>
          <div class="hud-tap">Pace<b id="paceVal">100</b></div>
        </div>
        <button id="pushBtn" class="push" type="button">PUSH<small id="pushSub">x2 · 30s</small></button>
      </div>
      <div id="raceHud" class="race-hud hidden">
        <div class="race-hud-top"><span id="raceHudName">Race</span><b id="raceHudPos">P20</b></div>
        <div class="bar"><i id="raceHudBar"></i></div>
        <div class="race-hud-sub"><span>Tap to push!</span><span id="raceHudTime"></span></div>
      </div>
      <button id="pitBox" class="pit hidden" type="button">
        <span class="pit-title">PIT STOP! Tap in the green</span>
        <span class="pit-bar"><i id="pitZone" class="zone"></i><i id="pitPerfect" class="perfect"></i><i id="pitNeedle" class="needle"></i></span>
      </button>
      <div id="tapHint" class="tap-hint">TAP THE CAR</div>
      <div id="fx" class="fx"></div>
    </section>

    <main id="panels">
      <section class="panel active" data-panel="team">
        <div class="buybar">
          <span>Buy</span>
          <button class="seg active" data-buy="1" type="button">x1</button>
          <button class="seg" data-buy="10" type="button">x10</button>
          <button class="seg" data-buy="100" type="button">x100</button>
          <button class="seg" data-buy="max" type="button">MAX</button>
        </div>
        <div id="teamList" class="list"></div>
      </section>
      <section class="panel" data-panel="upgrades"><div id="upgBox" class="list"></div></section>
      <section class="panel" data-panel="garage"><div id="garageBox" class="list"></div></section>
      <section class="panel" data-panel="races"><div id="raceBox"></div></section>
      <section class="panel" data-panel="legacy"><div id="legacyBox"></div></section>
      <section class="panel" data-panel="more"><div id="moreBox"></div></section>
    </main>

    <nav class="tabs">
      <button class="tab active" data-tab="team" type="button"><span>🔧</span>Team</button>
      <button class="tab" data-tab="upgrades" type="button"><span>⚙️</span>Upgrades<i id="upgDot" class="dot hidden"></i></button>
      <button class="tab" data-tab="garage" type="button"><span>🏎️</span>Garage<i id="garageDot" class="dot hidden"></i></button>
      <button class="tab" data-tab="races" type="button"><span>🏁</span>Races<i id="raceDot" class="dot hidden"></i></button>
      <button class="tab" data-tab="legacy" type="button"><span>⭐</span>Legacy<i id="legacyDot" class="dot hidden"></i></button>
      <button class="tab" data-tab="more" type="button"><span>☰</span>More</button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div id="modalBtns" class="modal-btns"></div>
    </div>
  </div>

  <script src="cars.js"></script>
  <script src="photos.js"></script>
  <script src="game.js"></script>
</body>
</html>
